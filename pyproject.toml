[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-agent"
version = "0.1.0"
description = "A CLI-based AI coding agent that understands repositories, modifies code, and iteratively fixes problems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "typer>=0.12.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
agent = "terminal_agent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
